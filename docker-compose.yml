services:
  ticktick-mcp:
    build: .
    container_name: ticktick-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      PORT: 8080
      MCP_HTTP_PATH: /mcp
      TICKTICK_TOKEN_FILE: /data/tokens.json
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - token-data:/data

volumes:
  token-data:
